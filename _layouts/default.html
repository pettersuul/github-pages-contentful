<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
</head>
<body>
  <header>
    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      {% assign nav_pages = site.pages | where: "layout", "page" | sort: "title" %}
      {% for p in nav_pages %}
        <a href="{{ p.url | relative_url }}">{{ p.title }}</a>
      {% endfor %}
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
</body>
</html>
