title: Contentful + GitHub Pages
description: A Jekyll site whose content is fetched from Contentful at build time.
baseurl: ""
url: ""
# Primary language for <html lang> (see _layouts/default.html) -- update
# if the primary locale below isn't English. Other configured locales get
# their own <html lang> from their Contentful locale code automatically.
lang: en

# Contentful content types this site pulls entries from. Each entry
# becomes a generated page at /<dir>/<slug>/ (dir: "" = site root).
# nav: true lists it in the site nav; home: true groups it into a
# homepage section (see index.html), headed by label (string, or a Hash
# keyed by locale code) or a humanized content_type. order takes a
# Contentful CDA order value (default "-sys.updatedAt"). body_field sets
# a different content field name (needed if it's literally "content",
# which collides with Jekyll's page.content). image_field sets a
# different Open Graph/Twitter image field (see _includes/seo.html),
# exposed as page.social_image either way.
# Add or remove collections here to adapt this template to a new site.
contentful_collections:
  - content_type: post
    layout: single
    dir: posts
    home: true
    order: "-fields.publishDate"
  - content_type: page
    layout: single
    dir: ""
    nav: true

# Optional: how deep a linked entry's own fields get flattened before
# falling back to an {id, link_type} stub. Defaults to 2 if unset.
# contentful_entry_depth: 2

# Optional: build every collection/data collection once per locale (from
# Contentful Settings > Locales). Omit for a single-locale site. With 2+
# locales, the first is primary (unprefixed URLs/site.data keys); every
# other locale gets its own /<prefix>/... URL prefix and
# site.data.<name>_<prefix> key. An entry is a bare code (prefix == code)
# or {code:, prefix:} for a different prefix -- quote a prefix that could
# look like a YAML boolean (no/yes/on/off), or it becomes true/false.
# contentful_locales:
#   - en-US
#   - nb-NO

# Content types fetched into site.data.<name> instead of generated pages
# -- for entries only ever linked to from others (e.g. authors,
# manufacturers), with no page of their own.
# contentful_data_collections:
#   - content_type: author
#     name: authors

exclude:
  - README.md
  - CLAUDE.md
  - .env.example
